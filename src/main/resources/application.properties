spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:agents_of_leap}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

mybatis.configuration.map-underscore-to-camel-case=true

spring.jpa.hibernate.ddl-auto=validate
server.port=8083

# JWTs are issued and signed by the NestJS auth service. Spring receives only its public JWKS.
auth.jwt.jwks-uri=${AUTH_JWT_JWKS_URI:http://localhost:3000/.well-known/jwks.json}
auth.jwt.issuer=${AUTH_JWT_ISSUER:http://localhost:3000}
auth.jwt.audience=${AUTH_JWT_AUDIENCE:mission-service}