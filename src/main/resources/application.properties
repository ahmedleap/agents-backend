# Primary Transactional Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:agents_of_leap}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:n3u3d4!}
spring.datasource.driver-class-name=org.postgresql.Driver

# MyBatis Configuration
# Warehouse Analytics Database
spring.datasource.warehouse.url=jdbc:postgresql://${WAREHOUSE_DB_HOST:localhost}:${WAREHOUSE_DB_PORT:15432}/${WAREHOUSE_DB_NAME:warehouse}
spring.datasource.warehouse.username=${WAREHOUSE_DB_USER:postgres}
spring.datasource.warehouse.password=${WAREHOUSE_DB_PASSWORD:n3u3d4!}
spring.datasource.warehouse.driver-class-name=org.postgresql.Driver

spring.kafka.bootstrap-servers=10.14.131.55:9092
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.group-id=order-fulfillment-group
spring.kafka.consumer.auto-offset-reset=earliest
kafka.topic.retry=order-fulfillment-retry
kafka.topic.dlq=order-fulfillment-dlt
kafka.retry.delay-ms=60000

mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-query-timeout=30

# Server Configuration
server.port=8081

# Local development bootstrap for creating the first administrator.
# Disable this in deployed environments.
app.admin-bootstrap.enabled=false

# Document the analytics, orders, instruments, JWT, account, holding, admin, and news APIs in Swagger/OpenAPI.
springdoc.paths-to-match=/api/v1/analytics/**,/api/v1/orders/**,/api/instruments/**,/api/jwt/**,/api/accounts/**,/api/holding/**,/api/admins/**,/api/news/**

# Marketaux configuration. Set MARKETAUX_API_KEY in the runtime environment.
news.marketaux-api-url=${MARKETAUX_API_URL:https://api.marketaux.com/v1/news/all}
news.marketaux-api-token=${MARKETAUX_API_KEY:}

# Frontend origins allowed to call the API (comma-separated)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Cache Configuration (disabled - all data fetched fresh)
spring.cache.type=none

# JPA Disabled (Pure MyBatis)
spring.jpa.hibernate.ddl-auto=validate

# Logging
logging.level.root=WARN
logging.level.com.agentsbackend=DEBUG
logging.level.org.springframework.web=DEBUG


# Order processing mode: "queue" (default) or "kafka"
order.processing.mode=kafka

# ---- Connection pool limits (primary) ----
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.data-source-properties.ApplicationName=agents-backend-${APP_INSTANCE:${user.name:unknown}}

# ---- Connection pool limits (warehouse) ----
spring.datasource.warehouse.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.warehouse.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.warehouse.hikari.idle-timeout=60000
spring.datasource.warehouse.hikari.max-lifetime=1500000
spring.datasource.warehouse.hikari.data-source-properties.ApplicationName=agents-backend-wh-${APP_INSTANCE:${user.name:unknown}}

# ---- Close pools cleanly on shutdown ----
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s