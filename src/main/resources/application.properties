
# Load local ignored .env settings when present; real process environment values override them.
spring.config.import=optional:file:.env[.properties]

# PostgreSQL database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:agents_of_leap}
# Primary Transactional Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:agents_of_leap}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# MyBatis
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-query-timeout=30

# Server Configuration
server.port=8081

# JPA
spring.jpa.hibernate.ddl-auto=validate

# Server
server.port=8083


# JWT Authentication Configuration

# Trusted issuer publishes public verification keys (JWKS). Spring does not load a private key.
auth.jwt.jwks-uri=${AUTH_JWT_JWKS_URI:http://127.0.0.1:3000/.well-known/jwks.json}

# NestJS RSA public key PEM file. Override with JWT_PUBLIC_KEY_FILE if it lives elsewhere.
auth.jwt.public-key-file=${JWT_PUBLIC_KEY_FILE:public_key.pem}

# Optional Base64-encoded PEM fallback for environments that inject keys as variables.
auth.jwt.public-key-base64=${JWT_PUBLIC_KEY:}

# Expected issuer
auth.jwt.issuer=${AUTH_JWT_ISSUER:agents-middleware}

# Expected audience
auth.jwt.audience=${AUTH_JWT_AUDIENCE:agents-backend}
