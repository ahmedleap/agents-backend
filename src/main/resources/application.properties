# Primary Transactional Database
spring.datasource.jdbc-url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:agents_of_leap}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# MyBatis Configuration
# Warehouse Analytics Database
spring.datasource.warehouse.jdbc-url=jdbc:postgresql://${WAREHOUSE_DB_HOST:localhost}:${WAREHOUSE_DB_PORT:25432}/${WAREHOUSE_DB_NAME:test_db}
spring.datasource.warehouse.username=${WAREHOUSE_DB_USER:test}
spring.datasource.warehouse.password=${WAREHOUSE_DB_PASSWORD:}
spring.datasource.warehouse.driver-class-name=org.postgresql.Driver

spring.kafka.bootstrap-servers=
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.group-id=order-fulfillment-group
spring.kafka.consumer.auto-offset-reset=earliest
kafka.topic.retry=order-fulfillment-retry
kafka.topic.dlq=order-fulfillment-dlt
kafka.retry.delay-ms=60000

mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-query-timeout=30

# Server Configuration
server.port=8081

# Cache Configuration (disabled - all data fetched fresh)
spring.cache.type=none

# JPA Disabled (Pure MyBatis)
spring.jpa.hibernate.ddl-auto=validate

# Logging
logging.level.root=WARN
logging.level.com.agentsbackend=DEBUG
logging.level.org.springframework.web=DEBUG


# Order processing mode: "queue" (default) or "kafka"
order.processing.mode=kafka