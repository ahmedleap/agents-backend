# Load local ignored settings; process environment variables override them.
spring.config.import=optional:file:.env[.properties]

# Primary Transactional Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:10.14.131.55}:${DB_PORT:5432}/${DB_NAME:agents_of_leap}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# MyBatis Configuration
# Warehouse Analytics Database
spring.datasource.warehouse.url=jdbc:postgresql://${WAREHOUSE_DB_HOST:localhost}:${WAREHOUSE_DB_PORT:15432}/${WAREHOUSE_DB_NAME:warehouse}
spring.datasource.warehouse.username=${WAREHOUSE_DB_USER:postgres}
spring.datasource.warehouse.password=${WAREHOUSE_DB_PASSWORD:}
spring.datasource.warehouse.driver-class-name=org.postgresql.Driver

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.group-id=order-fulfillment-group
spring.kafka.consumer.auto-offset-reset=earliest
kafka.topic.retry=order-fulfillment-retry
kafka.topic.dlq=order-fulfillment-dlt
kafka.retry.delay-ms=60000

mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-query-timeout=30

# Server Configuration
server.port=8081

# Frontend origins allowed to call the API (comma-separated)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Validate external RS256 access tokens issued by the identity service.
auth.jwt.public-key-file=${JWT_PUBLIC_KEY_FILE:public_key.pem}
auth.jwt.public-key-base64=${JWT_PUBLIC_KEY:}
auth.jwt.issuer=${AUTH_JWT_ISSUER:agents-middleware}
auth.jwt.audience=${AUTH_JWT_AUDIENCE:agents-backend}

# Cache Configuration (disabled - all data fetched fresh)
spring.cache.type=none

# JPA Disabled (Pure MyBatis)
spring.jpa.hibernate.ddl-auto=validate

# Logging
logging.level.root=WARN
logging.level.com.agentsbackend=DEBUG
logging.level.org.springframework.web=DEBUG


# Order processing mode: "queue" (default) or "kafka"
order.processing.mode=kafka

# Require a live auth_sessions row for every authenticated JWT.
auth.session-validation.enabled=${AUTH_SESSION_VALIDATION:true}
auth.session.inactivity-minutes=${AUTH_SESSION_INACTIVITY_MINUTES:30}
