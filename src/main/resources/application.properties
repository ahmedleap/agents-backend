
# PostgreSQL database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:agents_of_leap}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# MyBatis
mybatis.configuration.map-underscore-to-camel-case=true

# JPA
spring.jpa.hibernate.ddl-auto=validate

# Server
server.port=8083


# JWT Authentication Configuration

# RSA public key provided by NestJS authentication service
auth.jwt.public-key=${JWT_PUBLIC_KEY}

# Expected issuer
auth.jwt.issuer=${AUTH_JWT_ISSUER}

# Expected audience
auth.jwt.audience=${AUTH_JWT_AUDIENCE}
