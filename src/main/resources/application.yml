# JWT Configuration (Asymmetric RSA Keys)
# Use the existing middleware signing public key; do not generate a separate backend key pair.
# The backend must receive only the public key, either as a PEM file or as a
# Base64-encoded PEM value in JWT_PUBLIC_KEY.
auth:
  jwt:
    public-key-file: ${JWT_PUBLIC_KEY_FILE:public_key.pem}
    # Set JWT_PUBLIC_KEY to the Base64-encoded PEM for the middleware's RSA 2048+ public key.
    public-key-base64: ${JWT_PUBLIC_KEY:}
    issuer: ${JWT_ISSUER:agents-middleware}
    audience: ${JWT_AUDIENCE:agents-backend}